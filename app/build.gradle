plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.darkroot.ytdownloader'
    compileSdk 34

    defaultConfig {
        applicationId "com.darkroot.ytdownloader"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            // Required by youtubedl-android - it bundles native binaries
            // (python/yt-dlp/ffmpeg) for these ABIs only.
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Lightweight image loader for video/thumbnail previews - Kotlin-first,
    // no annotation processor, small footprint.
    implementation 'io.coil-kt:coil:2.6.0'

    // yt-dlp + ffmpeg ported for Android - no system ffmpeg needed,
    // it ships its own binary, so this avoids the "ffmpeg not found"
    // issue we hit on Pydroid3.
    // NOTE: this library moved off JitPack to Maven Central under the
    // io.github.junkfood02 namespace - mavenCentral() in settings.gradle
    // covers it, no jitpack maven entry needed for this dependency.
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.0'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // In-app video playback - no redirect to an external player app
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.media3:media3-common:1.3.1'
}
